name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Debug APK always builds (no keystore required)
      - name: Build debug
        run: ./gradlew assembleDebug --stacktrace

      # Release signing: only when all four secrets are configured
      - name: Decode release keystore
        if: ${{ secrets.SIGNING_KEYSTORE != '' && secrets.SIGNING_STORE_PASSWORD != '' && secrets.SIGNING_KEY_ALIAS != '' && secrets.SIGNING_KEY_PASSWORD != '' }}
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > "${{ github.workspace }}/quicknotevibe-release.jks"
          cat > "${{ github.workspace }}/keystore.properties" << PROPS
          storeFile=${{ github.workspace }}/quicknotevibe-release.jks
          storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}
          keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}
          keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}
          PROPS
          # Strip accidental leading spaces from heredoc lines
          sed -i 's/^[[:space:]]*//' "${{ github.workspace }}/keystore.properties"
          echo "keystore.properties written; storeFile=$(grep storeFile keystore.properties)"

      - name: Build signed release
        if: ${{ secrets.SIGNING_KEYSTORE != '' && secrets.SIGNING_STORE_PASSWORD != '' && secrets.SIGNING_KEY_ALIAS != '' && secrets.SIGNING_KEY_PASSWORD != '' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload release APK
        if: ${{ secrets.SIGNING_KEYSTORE != '' && secrets.SIGNING_STORE_PASSWORD != '' && secrets.SIGNING_KEY_ALIAS != '' && secrets.SIGNING_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: warn
