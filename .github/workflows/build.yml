name: Build QuickNoteVibe

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the generated wrapper back

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle with caching (pin 8.7)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper if missing
        if: ${{ !hashFiles('gradlew') }}
        run: |
          echo "gradlew not found — generating wrapper"
          gradle wrapper --gradle-version 8.7
          gradle --version   # sanity check

      - name: Commit wrapper back to repo
        if: ${{ !hashFiles('gradlew@{0}') }}
        # no-op guard below handled by the previous step having created files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "ci: add Gradle wrapper (auto-generated)"
            git push
            echo "Wrapper committed — build will use it on the NEXT run."
          fi

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickNoteVibe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/