name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug
        run: ./gradlew assembleDebug --stacktrace

      # secrets cannot be used in `if:` — check inside the shell instead
      - name: Decode release keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || \
             [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "Signing secrets not configured — skipping release keystore setup."
            exit 0
          fi
          echo "$SIGNING_KEYSTORE" | base64 -d > "${{ github.workspace }}/quicknotevibe-release.jks"
          cat > "${{ github.workspace }}/keystore.properties" << PROPS
          storeFile=${{ github.workspace }}/quicknotevibe-release.jks
          storePassword=${SIGNING_STORE_PASSWORD}
          keyAlias=${SIGNING_KEY_ALIAS}
          keyPassword=${SIGNING_KEY_PASSWORD}
          PROPS
          sed -i 's/^[[:space:]]*//' "${{ github.workspace }}/keystore.properties"
          echo "keystore.properties written."

      - name: Build signed release
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ] || [ ! -f keystore.properties ]; then
            echo "No keystore — skipping assembleRelease."
            exit 0
          fi
          ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: warn
