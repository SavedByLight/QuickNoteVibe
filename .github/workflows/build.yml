name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug
        run: ./gradlew assembleDebug --stacktrace

      # secrets cannot be used in step `if:` — check inside the shell instead
      - name: Decode release keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || \
             [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "Signing secrets not configured — skipping release keystore setup."
            exit 0
          fi
          echo "$SIGNING_KEYSTORE" | base64 -d > "${{ github.workspace }}/quicknotevibe-release.jks"
          cat > "${{ github.workspace }}/keystore.properties" << PROPS
          storeFile=${{ github.workspace }}/quicknotevibe-release.jks
          storePassword=${SIGNING_STORE_PASSWORD}
          keyAlias=${SIGNING_KEY_ALIAS}
          keyPassword=${SIGNING_KEY_PASSWORD}
          PROPS
          sed -i 's/^[[:space:]]*//' "${{ github.workspace }}/keystore.properties"
          echo "keystore.properties written."

      - name: Build signed release
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ] || [ ! -f keystore.properties ]; then
            echo "No keystore — skipping assembleRelease."
            exit 0
          fi
          ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: warn

      # --- GitHub Release (push to main or version tags only; not PRs) ---
      - name: Prepare release assets
        if: github.event_name != 'pull_request'
        id: assets
        run: |
          mkdir -p release-assets
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk \
              "release-assets/GitNotes-debug-${{ github.run_number }}.apk"
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk \
              "release-assets/GitNotes-release-${{ github.run_number }}.apk"
          fi
          ls -la release-assets || true
          if ls release-assets/*.apk >/dev/null 2>&1; then
            echo "has_assets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_assets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: github.event_name != 'pull_request' && steps.assets.outputs.has_assets == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # Tag: use push tag (v1.2.3) or auto-tag from run number on main
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', github.run_number) }}
          body: |
            Automated build from `${{ github.sha }}` on `${{ github.ref_name }}`.

            | Artifact | Notes |
            |----------|--------|
            | `GitNotes-release-*.apk` | Signed release (if signing secrets configured) |
            | `GitNotes-debug-*.apk` | Debug build |

            Commit: ${{ github.sha }}
          files: release-assets/*
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
