name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      versionName:
        description: "App version name (e.g. 1.2.3). Leave empty to use defaults."
        required: false
        type: string
        default: ""
      versionCode:
        description: "App version code (integer). Leave empty to use run number or 1."
        required: false
        type: string
        default: ""
      create_release:
        description: "Create a GitHub Release after the build?"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Manual versioning priority:
      # 1. workflow_dispatch inputs
      # 2. git tag (v1.2.3 → 1.2.3)
      # 3. defaults (1.0 / 1)
      - name: Resolve version
        id: version
        run: |
          INPUT_NAME="${{ github.event.inputs.versionName }}"
          INPUT_CODE="${{ github.event.inputs.versionCode }}"

          if [ -n "$INPUT_NAME" ]; then
            VERSION_NAME="$INPUT_NAME"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="1.0"
          fi

          if [ -n "$INPUT_CODE" ]; then
            VERSION_CODE="$INPUT_CODE"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_CODE="${{ github.run_number }}"
          else
            VERSION_CODE="1"
          fi

          echo "versionName=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Using versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Build debug
        run: >
          ./gradlew assembleDebug --stacktrace
          -PversionName=${{ steps.version.outputs.versionName }}
          -PversionCode=${{ steps.version.outputs.versionCode }}

      # secrets cannot be used in step `if:` — check inside the shell instead
      - name: Decode release keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set +e
          if [ -z "$SIGNING_KEYSTORE" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || \
             [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "Signing secrets not configured — skipping release keystore setup."
            exit 0
          fi
          echo "\( SIGNING_KEYSTORE" | base64 -d > " \){{ github.workspace }}/quicknotevibe-release.jks"
          if [ \( ? -ne 0 ] || [ ! -s " \){{ github.workspace }}/quicknotevibe-release.jks" ]; then
            echo "Failed to decode SIGNING_KEYSTORE (invalid base64 or empty). Skipping release signing."
            rm -f "${{ github.workspace }}/quicknotevibe-release.jks"
            exit 0
          fi
          cat > "${{ github.workspace }}/keystore.properties" << PROPS
          storeFile=${{ github.workspace }}/quicknotevibe-release.jks
          storePassword=${SIGNING_STORE_PASSWORD}
          keyAlias=${SIGNING_KEY_ALIAS}
          keyPassword=${SIGNING_KEY_PASSWORD}
          PROPS
          sed -i 's/^[[:space:]]*//' "${{ github.workspace }}/keystore.properties"
          echo "keystore.properties written."
          exit 0

      - name: Build signed release
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ] || [ ! -f keystore.properties ]; then
            echo "No keystore — skipping assembleRelease."
            exit 0
          fi
          ./gradlew assembleRelease --stacktrace \
            -PversionName=${{ steps.version.outputs.versionName }} \
            -PversionCode=${{ steps.version.outputs.versionCode }}

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: warn

      # --- GitHub Release ---
      # Triggers when:
      #   - a v* tag is pushed, OR
      #   - workflow_dispatch with create_release = true
      - name: Prepare release assets
        if: >
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        id: assets
        run: |
          mkdir -p release-assets
          # Prefer the resolved versionName; fall back to ref name
          TAG="${{ steps.version.outputs.versionName }}"
          if [ -z "$TAG" ] || [ "$TAG" = "1.0" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk \
              "release-assets/QuickNoteVibe-debug-${TAG}.apk"
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk \
              "release-assets/QuickNoteVibe-release-${TAG}.apk"
          fi
          ls -la release-assets || true
          if ls release-assets/*.apk >/dev/null 2>&1; then
            echo "has_assets=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "has_assets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: >
          (startsWith(github.ref, 'refs/tags/') ||
           (github.event_name == 'workflow_dispatch' && inputs.create_release == true)) &&
          steps.assets.outputs.has_assets == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push use the tag; on manual dispatch use v{versionName}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.versionName) }}
          name: QuickNoteVibe ${{ steps.version.outputs.versionName }}
          body: |
            Release `${{ steps.version.outputs.versionName }}` (versionCode \( {{ steps.version.outputs.versionCode }}) from ` \){{ github.sha }}`.

            | Artifact | Notes |
            |----------|--------|
            | `QuickNoteVibe-release-*.apk` | Signed release (if signing secrets configured) |
            | `QuickNoteVibe-debug-*.apk` | Debug build |

            Commit: ${{ github.sha }}

            See CHANGELOG.md for details.
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}